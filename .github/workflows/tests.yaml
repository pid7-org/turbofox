name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  core:
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: aarch64
          - os: macos-latest
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ matrix.arch }}-stable

      - name: Format check
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy --all-features --release -- -D warnings

      - name: Cargo check (lib)
        run: cargo check --release --all-features

      - name: Cargo check (tests)
        run: cargo check --tests --release --all-features

      - name: Cargo check (benches)
        run: cargo check --benches --release --all-features

      - name: Cargo test (debug)
        run: cargo test --all-features -- --nocapture

      - name: Cargo test (release)
        run: cargo test --all-features --release -- --nocapture

  linux:
    needs: core
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ matrix.arch }}-stable

      - name: Run tests (debug)
        run: cargo test --all-features -- --nocapture

      - name: Run tests (release)
        run: cargo test --all-features --release -- --nocapture

  windows:
    needs: core
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x86_64
          - os: windows-2022
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ matrix.arch }}-stable

      - name: Run tests (debug)
        run: cargo test --all-features -- --nocapture

      - name: Run tests (release)
        run: cargo test --all-features --release -- --nocapture

  macos:
    needs: core
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
          - os: macos-14
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ matrix.arch }}-stable

      - name: Run tests (debug)
        run: cargo test --all-features -- --nocapture

      - name: Run tests (release)
        run: cargo test --all-features --release -- --nocapture

  macos_intel:
    needs: core
    runs-on: macos-15-intel
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-macos-x86-stable

      - name: Cargo check (lib)
        run: cargo check --release --all-features

      - name: Cargo check (tests)
        run: cargo check --tests --release --all-features

  msrv:
    needs: core
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-msrv-1.86.0

      - name: Format check
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy --all-features --release -- -D warnings

      - name: Cargo check (lib)
        run: cargo check --release --all-features

      - name: Cargo check (tests)
        run: cargo check --tests --release --all-features

      - name: Cargo check (benches)
        run: cargo check --benches --release --all-features

      - name: Run tests (debug)
        run: cargo test --all-features -- --nocapture

      - name: Run tests (release)
        run: cargo test --all-features --release -- --nocapture
