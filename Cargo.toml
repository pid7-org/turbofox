[package]
name = "turbofox"
version = "0.0.1"
edition = "2024"
rust-version = "1.86.0"
description = "Embedded Key-Value database for on-device storage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pid7-org/turbofox"
keywords = [
    "database",
    "persistence",
    "storage",
]
categories = [
    "caching",
    "database-implementations",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
additional-targets = ["i686-apple-darwin"]
targets = [
    "aarch64-apple-darwin",
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
]

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
incremental = false

[profile.profile]
debug = true
lto = "off"
strip = "none"
opt-level = 2
codegen-units = 1
inherits = "release"
overflow-checks = false
debug-assertions = false

[dependencies]
twox-hash = { version = "2.1.5", features = ["xxhash32"] }
frozen-core = { version = "0.0.36", features = ["memmap", "ack", "hints", "isa", "error"] }
turbo_crc = { version = "0.0.4" }

[dev-dependencies]
tempfile = "3.27.0"
