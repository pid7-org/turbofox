[package]
name = "turbofox"
version = "0.0.101"
edition = "2024"
rust-version = "1.86.0"
description = "An embedded, memory-mapped key-value engine providing lock-free concurrency & explicit sync barriers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pid7-org/turbofox"
keywords = [
    "database",
    "persistence",
    "storage",
]
categories = [
    "caching",
    "database-implementations",
]
exclude = [
    "/assets",
    "/bencher",
    "/scripts",
    "/.github",
    "BENCHMARKS.md",
    "DESIGN.md",
    "rustfmt.toml",
]
autobenches = false

[[bench]]
name = "init_perf"
harness = false

[[bench]]
name = "kv_perf"
harness = false

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
additional-targets = ["i686-apple-darwin"]
targets = [
    "aarch64-apple-darwin",
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
]

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
incremental = false

[profile.profile]
debug = true
lto = "off"
strip = "none"
opt-level = 2
codegen-units = 1
inherits = "release"
overflow-checks = false
debug-assertions = false

[dependencies]
twox-hash = { version = "2.1.5", features = ["xxhash32"] }
frozen-core = { version = "0.0.38", features = ["memmap", "ack", "hints", "isa", "error"] }
turbo_crc = { version = "0.0.4" }

[dev-dependencies]
hdrhistogram = "7.5.4"
tempfile = "3.27.0"
