<text x="36" y="476" fill="#6c6f85" font-size="8">* Note: p99 tail latency across 1T and 4T worker threads; Point Hit/Miss tests uniform lookup vs key-not-found rejection; Zipfian (80/20) evaluates cache skew; Churn 50/50 stresses tombstone cleanup</text>
