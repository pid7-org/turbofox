<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" style="background:#ffffff; font-family:ui-monospace,'SF Mono',Menlo,Monaco,Consolas,'Liberation Mono',monospace;">
<rect width="880" height="460" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
