<text x="67" y="192.3" fill="#57606a" font-size="9" text-anchor="end">0.8x</text>
<line x1="75" y1="146.7" x2="805" y2="146.7" stroke="#e1e4e8" stroke-dasharray="3,3" stroke-width="1"/>
<text x="67" y="150.7" fill="#57606a" font-size="9" text-anchor="end">1.0x</text>
