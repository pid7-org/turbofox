<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" style="background:#ffffff; font-family:ui-monospace,'SF Mono',Menlo,Monaco,Consolas,'Liberation Mono',monospace;">
<rect width="880" height="460" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="32" y="34" fill="#24292f" font-size="16" font-weight="bold">Resident Memory (RAM) Footprint Under Concurrency</text>
<text x="32" y="54" fill="#57606a" font-size="11">Peak memory consumption (RSS) comparing 1-Thread vs 2-Threads for 1M operations</text>
<rect x="80" y="85" width="725" height="290" fill="#f8f9fa" rx="6" stroke="#e1e4e8" stroke-width="1"/>
<line x1="80" y1="355.0" x2="805" y2="355.0" stroke="#e1e4e8" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="359.0" fill="#57606a" font-size="9" text-anchor="end">0 MB</text>
<line x1="80" y1="305.0" x2="805" y2="305.0" stroke="#e1e4e8" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="309.0" fill="#57606a" font-size="9" text-anchor="end">22 MB</text>
<line x1="80" y1="255.0" x2="805" y2="255.0" stroke="#e1e4e8" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="259.0" fill="#57606a" font-size="9" text-anchor="end">44 MB</text>
<line x1="80" y1="205.0" x2="805" y2="205.0" stroke="#e1e4e8" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="209.0" fill="#57606a" font-size="9" text-anchor="end">66 MB</text>
<line x1="80" y1="155.0" x2="805" y2="155.0" stroke="#e1e4e8" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="159.0" fill="#57606a" font-size="9" text-anchor="end">88 MB</text>
<line x1="80" y1="105.0" x2="805" y2="105.0" stroke="#e1e4e8" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="109.0" fill="#57606a" font-size="9" text-anchor="end">110 MB</text>
<rect x="155.8" y="152.8" width="90" height="202.2" rx="5" fill="#179299"/>
<text x="200.8" y="144.8" fill="#24292f" font-size="12" font-weight="bold" text-anchor="middle">89.0MB</text>
<text x="200.8" y="395" fill="#24292f" font-size="12" font-weight="bold" text-anchor="middle">Database On-Disk Size</text>
<text x="200.8" y="413" fill="#57606a" font-size="9.5" text-anchor="middle">Shared NVMe Storage</text>
<rect x="397.5" y="260.5" width="90" height="94.5" rx="5" fill="#8839ef"/>
<text x="442.5" y="252.5" fill="#24292f" font-size="12" font-weight="bold" text-anchor="middle">41.6MB</text>
<text x="442.5" y="395" fill="#24292f" font-size="12" font-weight="bold" text-anchor="middle">Single-Thread RAM</text>
<text x="442.5" y="413" fill="#57606a" font-size="9.5" text-anchor="middle">1 Worker Transaction</text>
<rect x="639.2" y="196.8" width="90" height="158.2" rx="5" fill="#df8e1d"/>
<text x="684.2" y="188.8" fill="#24292f" font-size="12" font-weight="bold" text-anchor="middle">69.6MB</text>
<text x="684.2" y="395" fill="#24292f" font-size="12" font-weight="bold" text-anchor="middle">Two-Threads RAM</text>
<text x="684.2" y="413" fill="#57606a" font-size="9.5" text-anchor="middle">+82.9% Concurrency Buffers</text>
</svg>