<text x="70" y="262.5" fill="#6c6f85" font-size="10" text-anchor="end">5.0 kops/s</text>
<line x1="80" y1="171.8" x2="960" y2="171.8" stroke="#bcc0cc" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="175.8" fill="#6c6f85" font-size="10" text-anchor="end">7.5 kops/s</text>
<line x1="80" y1="85.0" x2="960" y2="85.0" stroke="#bcc0cc" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="89.0" fill="#6c6f85" font-size="10" text-anchor="end">10.0 kops/s</text>
<rect x="164.7" y="391.1" width="56" height="40.9" rx="4" fill="#1e66f5"/>
<text x="192.7" y="385.1" fill="#4c4f69" font-size="10" font-weight="bold" text-anchor="middle">1.2 kops/s</text>
