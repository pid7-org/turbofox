<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" style="background:#eff1f5; font-family:ui-monospace,'SF Mono',Menlo,Monaco,Consolas,'Liberation Mono',monospace;">
<rect width="1000" height="480" rx="12" fill="#eff1f5" stroke="#ccd0da" stroke-width="1"/>
<text x="32" y="32" fill="#4c4f69" font-size="16" font-weight="bold">TurboFox Operation Throughput (1T vs 2T)</text>
<text x="32" y="48" fill="#6c6f85" font-size="11">Sustained operations per second across concurrent worker threads</text>
<rect x="744" y="24" width="12" height="12" rx="2" fill="#1e66f5"/>
<text x="762" y="34" fill="#4c4f69" font-size="11">1 Thread</text>
<rect x="824" y="24" width="12" height="12" rx="2" fill="#8839ef"/>
<text x="842" y="34" fill="#4c4f69" font-size="11">2 Threads</text>
<rect x="80" y="85" width="880" height="347" fill="#e6e9ef" rx="6"/>
<line x1="80" y1="432.0" x2="960" y2="432.0" stroke="#bcc0cc" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="436.0" fill="#6c6f85" font-size="10" text-anchor="end">0 ops/s</text>
