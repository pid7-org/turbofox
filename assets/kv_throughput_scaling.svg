<text x="260.7" y="392.3" fill="#4c4f69" font-size="10" font-weight="bold" text-anchor="middle">971 ops/s</text>
<text x="226.7" y="452.0" fill="#4c4f69" font-size="12" font-weight="bold" text-anchor="middle">SET (Insert)</text>
<text x="226.7" y="468.0" fill="#6c6f85" font-size="11" text-anchor="middle">Speedup: 0.82x</text>
<rect x="458.0" y="366.6" width="56" height="65.4" rx="4" fill="#1e66f5"/>
<text x="486.0" y="360.6" fill="#4c4f69" font-size="10" font-weight="bold" text-anchor="middle">1.9 kops/s</text>
<rect x="526.0" y="367.6" width="56" height="64.4" rx="4" fill="#8839ef"/>
<text x="554.0" y="361.6" fill="#4c4f69" font-size="10" font-weight="bold" text-anchor="middle">1.9 kops/s</text>
<text x="520.0" y="452.0" fill="#4c4f69" font-size="12" font-weight="bold" text-anchor="middle">GET (60/40 Hit/Miss)</text>
<text x="520.0" y="468.0" fill="#6c6f85" font-size="11" text-anchor="middle">Speedup: 0.98x</text>
<rect x="751.3" y="366.5" width="56" height="65.5" rx="4" fill="#1e66f5"/>
<text x="779.3" y="360.5" fill="#4c4f69" font-size="10" font-weight="bold" text-anchor="middle">1.9 kops/s</text>
<rect x="819.3" y="367.6" width="56" height="64.4" rx="4" fill="#8839ef"/>
<text x="847.3" y="361.6" fill="#4c4f69" font-size="10" font-weight="bold" text-anchor="middle">1.9 kops/s</text>
<text x="813.3" y="452.0" fill="#4c4f69" font-size="12" font-weight="bold" text-anchor="middle">DEL (60/40 Hit/Miss)</text>
