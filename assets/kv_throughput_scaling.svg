<text x="842" y="34" fill="#4c4f69" font-size="11">4 Threads</text>
<rect x="80" y="85" width="880" height="347" fill="#e6e9ef" rx="6"/>
<line x1="80" y1="432.0" x2="960" y2="432.0" stroke="#bcc0cc" stroke-dasharray="3,3" stroke-width="1"/>
<text x="70" y="436.0" fill="#6c6f85" font-size="10" text-anchor="end">0 ops/s</text>
