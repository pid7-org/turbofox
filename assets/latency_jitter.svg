<text x="270" y="303.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">DELETE: Point Miss (Absent)</text>
<rect x="280" y="293.0" width="45.0" height="14" rx="2" fill="#209fb5"/>
<text x="331.0" y="303.0" fill="#209fb5" font-size="8" font-weight="bold">CV=0.48 (μ=0.67µs, σ=0.32µs)</text>
<text x="270" y="343.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">READ: Zipfian (80/20 Skew)</text>
<rect x="280" y="333.0" width="37.7" height="14" rx="2" fill="#fe640b"/>
<text x="323.7" y="343.0" fill="#fe640b" font-size="8" font-weight="bold">CV=0.40 (μ=1.05µs, σ=0.42µs)</text>
<text x="270" y="383.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">DELETE: Point Hit (Existing)</text>
<rect x="280" y="373.0" width="36.7" height="14" rx="2" fill="#d20f39"/>
<text x="322.7" y="383.0" fill="#d20f39" font-size="8" font-weight="bold">CV=0.39 (μ=1.67µs, σ=0.65µs)</text>
<text x="36" y="442" fill="#6c6f85" font-size="8">* Note: CV (Coefficient of Variation = σ / μ) quantifies relative latency jitter independent of scale; lower CV denotes superior SLA determinism; in-memory hash index probes and deletions show tight variance (CV &lt; 0.8)</text>
<text x="36" y="458" fill="#6c6f85" font-size="8">  Low jitter confirmed across branch targets and cache lines; WAL NVMe persistence displays elevated CV (~7.4) driven by hardware controller queueing and OS page writeback spikes during fsync barriers</text>
</svg>
