<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 536" width="1220" height="536" style="background:#faf4ed; font-family:ui-monospace,'SF Mono',Menlo,Monaco,Consolas,'Liberation Mono',monospace;">
<rect width="1220" height="536" rx="12" fill="#faf4ed" stroke="#dfdad9" stroke-width="1"/>
<text x="36" y="34" fill="#575279" font-size="16" font-weight="bold">TurboFox Latency Predictability &amp; Jitter Profile (CV = σ / μ)</text>
<text x="36" y="56" fill="#797593" font-size="10">Coefficient of variation (1T baseline): lower indicates tighter SLA predictability (Rosé Pine Dawn theme)</text>
<line x1="280.0" y1="80" x2="280.0" y2="400" stroke="#f2e9e1" stroke-width="1"/>
<text x="280.0" y="418" fill="#9893a5" font-size="8" text-anchor="middle">0.0</text>
<line x1="386.0" y1="80" x2="386.0" y2="400" stroke="#f2e9e1" stroke-width="1"/>
<text x="386.0" y="418" fill="#9893a5" font-size="8" text-anchor="middle">1.0</text>
<line x1="492.0" y1="80" x2="492.0" y2="400" stroke="#f2e9e1" stroke-width="1"/>
<text x="492.0" y="418" fill="#9893a5" font-size="8" text-anchor="middle">2.0</text>
<line x1="598.0" y1="80" x2="598.0" y2="400" stroke="#f2e9e1" stroke-width="1"/>
<text x="598.0" y="418" fill="#9893a5" font-size="8" text-anchor="middle">3.0</text>
<line x1="704.0" y1="80" x2="704.0" y2="400" stroke="#f2e9e1" stroke-width="1"/>
<text x="704.0" y="418" fill="#9893a5" font-size="8" text-anchor="middle">4.0</text>
<line x1="810.0" y1="80" x2="810.0" y2="400" stroke="#f2e9e1" stroke-width="1"/>
<text x="810.0" y="418" fill="#9893a5" font-size="8" text-anchor="middle">5.0</text>
<line x1="916.0" y1="80" x2="916.0" y2="400" stroke="#f2e9e1" stroke-width="1"/>
<text x="916.0" y="418" fill="#9893a5" font-size="8" text-anchor="middle">6.0</text>
<line x1="1022.0" y1="80" x2="1022.0" y2="400" stroke="#f2e9e1" stroke-width="1"/>
<text x="1022.0" y="418" fill="#9893a5" font-size="8" text-anchor="middle">7.0</text>
<line x1="1128.0" y1="80" x2="1128.0" y2="400" stroke="#f2e9e1" stroke-width="1"/>
<text x="1128.0" y="418" fill="#9893a5" font-size="8" text-anchor="middle">8.0</text>
<line x1="280" y1="80" x2="280" y2="400" stroke="#cecacd" stroke-width="1"/>
<text x="270" y="100.8" fill="#575279" font-size="8" font-weight="bold" text-anchor="end">WAL: Ingest (NVMe fsync)</text>
<rect x="280" y="90.8" width="781.1" height="14" rx="2" fill="#b4637a"/>
<text x="1067.1" y="100.8" fill="#b4637a" font-size="8" font-weight="bold">CV=7.37 (μ=77.24µs, σ=569.15µs)</text>
<text x="270" y="136.3" fill="#575279" font-size="8" font-weight="bold" text-anchor="end">DELETE: Hot-Key Contention</text>
<rect x="280" y="126.3" width="81.3" height="14" rx="2" fill="#907aa9"/>
<text x="367.3" y="136.3" fill="#907aa9" font-size="8" font-weight="bold">CV=0.77 (μ=0.30µs, σ=0.23µs)</text>
<text x="270" y="171.9" fill="#575279" font-size="8" font-weight="bold" text-anchor="end">READ: Point Miss (Absent)</text>
<rect x="280" y="161.9" width="66.2" height="14" rx="2" fill="#56949f"/>
<text x="352.2" y="171.9" fill="#56949f" font-size="8" font-weight="bold">CV=0.62 (μ=0.48µs, σ=0.30µs)</text>
<text x="270" y="207.4" fill="#575279" font-size="8" font-weight="bold" text-anchor="end">READ/WRITE: Mixed 95/5 OLTP</text>
<rect x="280" y="197.4" width="64.1" height="14" rx="2" fill="#ea9d34"/>
<text x="350.1" y="207.4" fill="#ea9d34" font-size="8" font-weight="bold">CV=0.60 (μ=0.86µs, σ=0.52µs)</text>
<text x="270" y="243.0" fill="#575279" font-size="8" font-weight="bold" text-anchor="end">CHURN: 50/50 Put/Del</text>
<rect x="280" y="233.0" width="57.6" height="14" rx="2" fill="#d7827e"/>
<text x="343.6" y="243.0" fill="#d7827e" font-size="8" font-weight="bold">CV=0.54 (μ=4.18µs, σ=2.27µs)</text>
<text x="270" y="278.6" fill="#575279" font-size="8" font-weight="bold" text-anchor="end">READ: Point Hit (Uniform)</text>
<rect x="280" y="268.6" width="56.3" height="14" rx="2" fill="#286983"/>
<text x="342.3" y="278.6" fill="#286983" font-size="8" font-weight="bold">CV=0.53 (μ=0.81µs, σ=0.43µs)</text>
<text x="270" y="314.1" fill="#575279" font-size="8" font-weight="bold" text-anchor="end">DELETE: Point Miss (Absent)</text>
<rect x="280" y="304.1" width="49.6" height="14" rx="2" fill="#31748f"/>
<text x="335.6" y="314.1" fill="#31748f" font-size="8" font-weight="bold">CV=0.47 (μ=0.47µs, σ=0.22µs)</text>
<text x="270" y="349.7" fill="#575279" font-size="8" font-weight="bold" text-anchor="end">READ: Zipfian (80/20 Skew)</text>
<rect x="280" y="339.7" width="42.7" height="14" rx="2" fill="#907aa9"/>
<text x="328.7" y="349.7" fill="#907aa9" font-size="8" font-weight="bold">CV=0.40 (μ=0.82µs, σ=0.33µs)</text>
<text x="270" y="385.2" fill="#575279" font-size="8" font-weight="bold" text-anchor="end">DELETE: Point Hit (Existing)</text>
<rect x="280" y="375.2" width="41.5" height="14" rx="2" fill="#b4637a"/>
<text x="327.5" y="385.2" fill="#b4637a" font-size="8" font-weight="bold">CV=0.39 (μ=1.48µs, σ=0.58µs)</text>
<text x="36" y="442" fill="#797593" font-size="8">* Note: CV (Coefficient of Variation = σ / μ) quantifies relative latency jitter independent of scale; lower CV denotes superior SLA determinism</text>
<text x="36" y="458" fill="#797593" font-size="8">  In-memory hash index probes and deletions show tight variance (CV &lt; 0.8), proving low jitter across branch targets and cache lines</text>
<text x="36" y="474" fill="#797593" font-size="8">  WAL NVMe persistence displays elevated CV (~7.4) driven by hardware controller queueing and OS page writeback spikes during fsync barriers</text>
</svg>
