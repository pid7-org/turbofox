<text x="270" y="103.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">WAL: Ingest (NVMe fsync)</text>
<rect x="280" y="93.0" width="726.3" height="14" rx="2" fill="#d20f39"/>
<text x="1012.3" y="103.0" fill="#d20f39" font-size="8" font-weight="bold">CV=7.71 (μ=110.88µs, σ=854.65µs)</text>
<text x="270" y="143.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">DELETE: Hot-Key Contention</text>
<rect x="280" y="133.0" width="47.1" height="14" rx="2" fill="#8839ef"/>
<text x="333.1" y="143.0" fill="#8839ef" font-size="8" font-weight="bold">CV=0.50 (μ=0.28µs, σ=0.14µs)</text>
<text x="270" y="183.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">READ: Point Miss (Absent)</text>
<rect x="280" y="173.0" width="45.7" height="14" rx="2" fill="#179299"/>
<text x="331.7" y="183.0" fill="#179299" font-size="8" font-weight="bold">CV=0.49 (μ=0.68µs, σ=0.33µs)</text>
