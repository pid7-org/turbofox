<text x="845.3" y="418" fill="#8c8fa1" font-size="8" text-anchor="middle">6.0</text>
<line x1="939.6" y1="80" x2="939.6" y2="400" stroke="#ccd0da" stroke-width="1"/>
<text x="939.6" y="418" fill="#8c8fa1" font-size="8" text-anchor="middle">7.0</text>
<line x1="1033.8" y1="80" x2="1033.8" y2="400" stroke="#ccd0da" stroke-width="1"/>
