<text x="36" y="442" fill="#797593" font-size="8">* Note: Speedup ratio (Ops_N / Ops_1T) benchmarked on AWS c5d.large (2 physical vCPUs); 2.0x represents ideal linear scaling limit</text>
<text x="36" y="458" fill="#797593" font-size="8">  In-memory read and churn workloads scale to ~1.22x - 1.32x at 2T saturation before hyperthread cache contention plateaus scaling at 4T</text>
<text x="36" y="474" fill="#797593" font-size="8">  WAL Ingest exhibits flat-to-regressive scaling (~0.85x - 1.03x) constrained by serialize-on-fsync queueing and storage controller barriers</text>
