<text x="36" y="442" fill="#6c6f85" font-size="8">* Note: Speedup ratio (Ops_4T / Ops_1T) benchmarked on AWS c5d.large (2 physical vCPUs); 2.0x represents ideal linear scaling limit; in-memory read and churn workloads scale before hyperthread contention plateaus at 4T</text>
<text x="36" y="458" fill="#6c6f85" font-size="8">  WAL Ingest exhibits flat-to-regressive scaling constrained by serialize-on-fsync queueing and storage controller barriers under concurrent fsync flush contention</text>
