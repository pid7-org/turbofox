<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 536" width="1220" height="536" style="background:#eff1f5; font-family:ui-monospace,'SF Mono',Menlo,Monaco,Consolas,'Liberation Mono',monospace;">
<rect width="1220" height="536" rx="12" fill="#eff1f5" stroke="#ccd0da" stroke-width="1"/>
<text x="36" y="34" fill="#4c4f69" font-size="16" font-weight="bold">TurboFox On-Disk Storage Footprint &amp; Allocation Density</text>
<text x="36" y="56" fill="#6c6f85" font-size="10">Final database storage footprint after 0x10000 operations per workload (Catppuccin Latte theme)</text>
<line x1="344.0" y1="84" x2="344.0" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="344.0" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">0 MB</text>
<line x1="468.8" y1="84" x2="468.8" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="468.8" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">20 MB</text>
<line x1="593.6" y1="84" x2="593.6" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="593.6" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">40 MB</text>
<line x1="718.4" y1="84" x2="718.4" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="718.4" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">60 MB</text>
<line x1="843.2" y1="84" x2="843.2" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="843.2" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">80 MB</text>
<line x1="968.0" y1="84" x2="968.0" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="968.0" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">100 MB</text>
<line x1="344" y1="84" x2="344" y2="404" stroke="#bcc0cc" stroke-width="1"/>
<line x1="344" y1="404" x2="968" y2="404" stroke="#bcc0cc" stroke-width="1"/>
<text x="334" y="119.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">CHURN: 50/50 Tombstones</text>
<rect x="344" y="108.0" width="498.6" height="16" rx="2" fill="#d20f39"/>
<text x="848.6" y="119.0" fill="#d20f39" font-size="8" font-weight="bold">79.90 MB (83,783,680 B)</text>
<text x="334" y="183.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">WAL: Ingest (Sequential Append)</text>
<rect x="344" y="172.0" width="498.6" height="16" rx="2" fill="#1e66f5"/>
<text x="848.6" y="183.0" fill="#1e66f5" font-size="8" font-weight="bold">79.90 MB (83,783,680 B)</text>
<text x="334" y="247.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">READ: Point Hit (Existing)</text>
<rect x="344" y="236.0" width="498.6" height="16" rx="2" fill="#179299"/>
<text x="848.6" y="247.0" fill="#179299" font-size="8" font-weight="bold">79.90 MB (83,783,680 B)</text>
<text x="334" y="311.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">DELETE: Point Hit (Existing)</text>
<rect x="344" y="300.0" width="498.6" height="16" rx="2" fill="#fe640b"/>
<text x="848.6" y="311.0" fill="#fe640b" font-size="8" font-weight="bold">79.90 MB (83,783,680 B)</text>
<text x="334" y="375.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">DELETE: Hot-Key Contention</text>
<rect x="344" y="364.0" width="2.0" height="16" rx="2" fill="#8839ef"/>
<text x="352.0" y="375.0" fill="#8839ef" font-size="8" font-weight="bold">0.03 MB (32,768 B)</text>
<text x="36" y="448" fill="#6c6f85" font-size="8">* Note: Final storage size includes index slot arrays, DataBuf pages, and header metadata; steady-state churn (50/50) demonstrates bounded storage footprint via tombstone recycling</text>
</svg>
