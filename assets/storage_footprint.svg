<text x="600.0" y="422" fill="#9893a5" font-size="8" text-anchor="middle">10 MB</text>
<line x1="728.0" y1="84" x2="728.0" y2="404" stroke="#f2e9e1" stroke-width="1"/>
<text x="728.0" y="422" fill="#9893a5" font-size="8" text-anchor="middle">15 MB</text>
