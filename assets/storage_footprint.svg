<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 480" width="1056" height="480" style="background:#eff1f5; font-family:'JetBrains Mono','Fira Code','Roboto Mono',Menlo,Monaco,Consolas,monospace;">
