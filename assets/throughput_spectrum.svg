<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 536" width="1220" height="536" style="background:#eff1f5; font-family:ui-monospace,'SF Mono',Menlo,Monaco,Consolas,'Liberation Mono',monospace;">
<rect width="1220" height="536" rx="12" fill="#eff1f5" stroke="#ccd0da" stroke-width="1"/>
<text x="36" y="34" fill="#4c4f69" font-size="16" font-weight="bold">TurboFox Full-Spectrum Operation Throughput (Log Scale)</text>
<text x="36" y="56" fill="#6c6f85" font-size="10">1-thread baseline (ops/sec): dynamic range from disk WAL to memory lookup (Catppuccin Latte theme)</text>
<line x1="304.0" y1="84" x2="304.0" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="304.0" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">1 kops/s</text>
<line x1="508.0" y1="84" x2="508.0" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="508.0" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">10 kops/s</text>
<line x1="712.0" y1="84" x2="712.0" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="712.0" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">100 kops/s</text>
<line x1="916.0" y1="84" x2="916.0" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="916.0" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">1 Mops/s</text>
<line x1="1120.0" y1="84" x2="1120.0" y2="404" stroke="#ccd0da" stroke-width="1"/>
<text x="1120.0" y="422" fill="#8c8fa1" font-size="8" text-anchor="middle">10 Mops/s</text>
<line x1="304" y1="84" x2="304" y2="404" stroke="#bcc0cc" stroke-width="1"/>
<line x1="304" y1="404" x2="1120" y2="404" stroke="#bcc0cc" stroke-width="1"/>
<text x="294" y="109.9" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">DELETE: Hot-Key Contention</text>
<rect x="304" y="100.9" width="714.6" height="12" rx="2" fill="#8839ef"/>
<text x="1024.6" y="109.9" fill="#8839ef" font-size="8" font-weight="bold">3.18 Mops/s</text>
<text x="294" y="155.6" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">DELETE: Point Miss (Absent)</text>
<rect x="304" y="146.6" width="642.8" height="12" rx="2" fill="#179299"/>
<text x="952.8" y="155.6" fill="#179299" font-size="8" font-weight="bold">1.42 Mops/s</text>
<text x="294" y="201.3" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">READ: Point Miss (Absent)</text>
<rect x="304" y="192.3" width="642.1" height="12" rx="2" fill="#1e66f5"/>
<text x="952.1" y="201.3" fill="#1e66f5" font-size="8" font-weight="bold">1.40 Mops/s</text>
<text x="294" y="247.0" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">READ: Point Hit (Existing)</text>
<rect x="304" y="238.0" width="609.4" height="12" rx="2" fill="#209fb5"/>
<text x="919.4" y="247.0" fill="#209fb5" font-size="8" font-weight="bold">971.4 kops/s</text>
<text x="294" y="292.7" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">READ: Zipfian (80/20 Skew)</text>
<rect x="304" y="283.7" width="604.4" height="12" rx="2" fill="#fe640b"/>
<text x="914.4" y="292.7" fill="#fe640b" font-size="8" font-weight="bold">917.8 kops/s</text>
<text x="294" y="338.4" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">DELETE: Point Hit (Existing)</text>
<rect x="304" y="329.4" width="564.7" height="12" rx="2" fill="#d20f39"/>
<text x="874.7" y="338.4" fill="#d20f39" font-size="8" font-weight="bold">586.1 kops/s</text>
<text x="294" y="384.1" fill="#4c4f69" font-size="8" font-weight="bold" text-anchor="end">WAL: Ingest (NVMe fsync)</text>
<rect x="304" y="375.1" width="194.8" height="12" rx="2" fill="#d20f39"/>
<text x="504.8" y="384.1" fill="#d20f39" font-size="8" font-weight="bold">9.0 kops/s</text>
<text x="36" y="448" fill="#6c6f85" font-size="8">* Note: Logarithmic scale spans 1 kops/sec to 0x0A Mops/sec at 1-thread core baseline; separates userspace memory-mapped slot lookup fast-paths from NVMe writeback latency</text>
</svg>
